name: Build and publish Qwen3-8B image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - cmd/**
      - docker/**
      - coreutils/**
      - internal/**
      - go.mod
      - .github/workflows/publish-qwen3-8b.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/groovy-agent
  IMAGE_TAG: qwen3-8b

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Qwen3-8B-Q4_K_M
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            DOWNLOAD_MODEL=1
            MODEL_URL=https://huggingface.co/unsloth/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf
            MODEL_FILENAME=Qwen3-8B-Q4_K_M.gguf
            MODEL_NAME=Qwen3-8B
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
